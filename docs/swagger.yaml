info:
  contact: {}
  description: Share Cat Nepeta Cataria API Documentation
  title: Share Cat Nepeta Cataria API
  version: "1.0"
paths:
  /achievements:
    get:
      consumes:
      - application/json
      description: 獲取所有成就的列表
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            items:
              $ref: '#/definitions/models.Achievement'
            type: array
        "500":
          description: Internal Server Error
          schema:
            additionalProperties:
              type: string
            type: object
      summary: 獲取所有成就
      tags:
      - achievements
    post:
      consumes:
      - application/json
      description: 創建新的成就
      parameters:
      - description: Achievement
        in: body
        name: achievement
        required: true
        schema:
          $ref: '#/definitions/models.Achievement'
      produces:
      - application/json
      responses:
        "201":
          description: Created
          schema:
            $ref: '#/definitions/models.Achievement'
        "400":
          description: Bad Request
          schema:
            additionalProperties:
              type: string
            type: object
        "500":
          description: Internal Server Error
          schema:
            additionalProperties:
              type: string
            type: object
      security:
      - BearerAuth: []
      summary: 創建新成就
      tags:
      - achievements
    put:
      consumes:
      - application/json
      description: 更新指定ID的成就
      parameters:
      - description: Achievement
        in: body
        name: achievement
        required: true
        schema:
          $ref: '#/definitions/models.Achievement'
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/models.Achievement'
        "400":
          description: Bad Request
          schema:
            additionalProperties:
              type: string
            type: object
        "404":
          description: Not Found
          schema:
            additionalProperties:
              type: string
            type: object
        "500":
          description: Internal Server Error
          schema:
            additionalProperties:
              type: string
            type: object
      security:
      - BearerAuth: []
      summary: 更新成就
      tags:
      - achievements
  /achievements/{id}:
    delete:
      consumes:
      - application/json
      description: 根據ID刪除成就
      parameters:
      - description: Achievement ID
        in: path
        name: id
        required: true
        type: integer
      produces:
      - application/json
      responses:
        "204":
          description: No Content
        "400":
          description: Bad Request
          schema:
            additionalProperties:
              type: string
            type: object
        "404":
          description: Not Found
          schema:
            additionalProperties:
              type: string
            type: object
        "500":
          description: Internal Server Error
          schema:
            additionalProperties:
              type: string
            type: object
      security:
      - BearerAuth: []
      summary: 刪除成就
      tags:
      - achievements
    get:
      consumes:
      - application/json
      description: 根據ID獲取特定成就
      parameters:
      - description: Achievement ID
        in: path
        name: id
        required: true
        type: integer
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/models.Achievement'
        "400":
          description: Bad Request
          schema:
            additionalProperties:
              type: string
            type: object
        "500":
          description: Internal Server Error
          schema:
            additionalProperties:
              type: string
            type: object
      summary: 獲取特定成就
      tags:
      - achievements
  /auth/login:
    post:
      consumes:
      - application/json
      description: 用戶登入，返回用戶信息和token
      parameters:
      - description: 登入請求
        in: body
        name: request
        required: true
        schema:
          $ref: '#/definitions/controllers.LoginRequest'
      produces:
      - application/json
      responses:
        "200":
          description: 登入成功
          schema:
            $ref: '#/definitions/controllers.LoginResponse'
        "400":
          description: 請求參數無效
          schema:
            additionalProperties:
              type: string
            type: object
        "401":
          description: 用戶名或密碼錯誤
          schema:
            additionalProperties:
              type: string
            type: object
        "500":
          description: 伺服器內部錯誤
          schema:
            additionalProperties:
              type: string
            type: object
      summary: 用戶登入
      tags:
      - auth
  /auth/refresh:
    post:
      consumes:
      - application/json
      description: 刷新token，返回新的token
      parameters:
      - description: 刷新請求
        in: body
        name: request
        required: true
        schema:
          $ref: '#/definitions/controllers.RefreshTokenRequest'
      produces:
      - application/json
      responses:
        "200":
          description: 刷新成功
          schema:
            $ref: '#/definitions/controllers.RefreshTokenResponse'
        "400":
          description: 請求參數無效
          schema:
            additionalProperties:
              type: string
            type: object
        "401":
          description: 無效的 Refresh Token
          schema:
            additionalProperties:
              type: string
            type: object
        "500":
          description: 伺服器內部錯誤
          schema:
            additionalProperties:
              type: string
            type: object
      summary: 刷新token
      tags:
      - auth
  /chat-sessions:
    post:
      consumes:
      - application/json
      description: 創建新的聊天會話
      parameters:
      - description: Chat Session
