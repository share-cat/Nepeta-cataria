            type: object
        "400":
          description: Bad Request
          schema:
            additionalProperties:
              type: string
            type: object
        "404":
          description: Not Found
          schema:
            additionalProperties:
              type: string
            type: object
      security:
      - BearerAuth: []
      summary: 刪除聊天會話
      tags:
      - chat_sessions
    get:
      consumes:
      - application/json
      description: 根據ID獲取特定聊天會話
      parameters:
      - description: Chat Session ID
        in: path
        name: id
        required: true
        type: integer
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/models.ChatSession'
        "400":
          description: Bad Request
          schema:
            additionalProperties:
              type: string
            type: object
        "404":
          description: Not Found
          schema:
            additionalProperties:
              type: string
            type: object
      summary: 獲取特定聊天會話
      tags:
      - chat_sessions
    put:
      consumes:
      - application/json
      description: 更新聊天會話的詳細信息
      parameters:
      - description: Chat Session ID
        in: path
        name: id
        required: true
        type: integer
      - description: Chat Session
        in: body
        name: chat_session
        required: true
        schema:
          $ref: '#/definitions/models.ChatSession'
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/models.ChatSession'
        "400":
          description: Bad Request
          schema:
            additionalProperties:
              type: string
            type: object
        "404":
          description: Not Found
          schema:
            additionalProperties:
              type: string
            type: object
      security:
      - BearerAuth: []
      summary: 更新聊天會話
      tags:
      - chat_sessions
  /chat-sessions/{id}/history:
    put:
      consumes:
      - application/json
      description: 更新聊天會話的歷史記錄
      parameters:
      - description: Chat Session ID
        in: path
        name: id
        required: true
        type: integer
      - description: Chat History
        in: body
        name: chat_history
        required: true
        schema: {}
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            additionalProperties:
              type: string
            type: object
        "400":
          description: Bad Request
          schema:
            additionalProperties:
              type: string
            type: object
        "404":
          description: Not Found
          schema:
            additionalProperties:
              type: string
            type: object
      security:
      - BearerAuth: []
      summary: 更新聊天歷史
      tags:
      - chat_sessions
  /chat-sessions/{id}/title:
