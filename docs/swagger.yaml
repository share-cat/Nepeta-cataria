            $ref: '#/definitions/models.ChatSession'
        "400":
          description: Bad Request
          schema:
            additionalProperties:
              type: string
            type: object
      security:
      - BearerAuth: []
      summary: 創建新聊天會話
      tags:
      - chat_sessions
  /chat-sessions/{id}:
    delete:
      consumes:
